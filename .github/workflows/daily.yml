name: Daily tender watch

on:
  # Main daily trigger: the control panel's Apps Script calls workflow_dispatch at 08:00 Dhaka with
  # once_per_day=true (Google's time triggers are reliable; see installDailyTrigger in Code.gs).
  # GitHub's own scheduler is best-effort (runs can start late or be dropped entirely), so these
  # slots remain as backups. The first run that succeeds sends the digest; later ones exit at once.
  schedule:
    - cron: "37 1 * * *"  # 07:37 Dhaka: main run, usually delivered around 8:00
    - cron: "13 3 * * *"  # 09:13 Dhaka: backup
    - cron: "47 5 * * *"  # 11:47 Dhaka: second backup
    - cron: "54 8 * * *"  # 14:54 Dhaka: last backup
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no email, no state change)"
        type: boolean
        default: false
      once_per_day:
        description: "Skip if a daily run already succeeded today (used by the sheet's daily trigger)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit data/seen.json back to the repo

concurrency:
  group: tender-watch
  cancel-in-progress: false

jobs:
  watch:
    # The daily schedule only runs in the deployment repo (the company copy), where the repository
    # variable TENDER_WATCH_ENABLED=true is set. The public portfolio copy stays idle: no secrets, no failing runs.
    if: github.event_name == 'workflow_dispatch' || vars.TENDER_WATCH_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}   # latest commit, so a backup slot sees the state an earlier slot saved

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # Last good copy of the control-panel settings, kept in the Actions cache (not committed,
      # because it holds recipient addresses and the repo may be public).
      - name: Restore settings backup
        uses: actions/cache/restore@v4
        with:
          path: data/settings_cache.json
          key: settings-${{ github.run_id }}
          restore-keys: settings-

      - name: Self-test (offline)
        run: python -m pytest -q

      - name: Check portals and send digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          COHERE_MODEL: ${{ vars.COHERE_MODEL }}
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          APPS_SCRIPT_TOKEN: ${{ secrets.APPS_SCRIPT_TOKEN }}
          # Optional alternative to the control panel for sending (SMTP with an app password):
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m agent.main ${{ inputs.dry_run && '--dry-run' || '' }} ${{ (github.event_name == 'schedule' || inputs.once_per_day) && '--once-per-day' || '' }}

      - name: Save settings backup
        if: always() && hashFiles('data/settings_cache.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/settings_cache.json
          key: settings-${{ github.run_id }}

      - name: Save memory of processed notices
        if: always() && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen.json
          if git diff --cached --quiet; then echo "no state change"; exit 0; fi
          # No "[skip ci]" here: when the newest commit carries it, GitHub can skip scheduled runs too.
          # (Pushes made with GITHUB_TOKEN never trigger workflows anyway.)
          git commit -m "Update processed notices"
          git pull --rebase --autostash
          git push
